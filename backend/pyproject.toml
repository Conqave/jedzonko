[project]
name = "jedzonko-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "Django>=6.1,<6.2",
  "djangorestframework>=3.18,<4",
  "mysqlclient>=2.2,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "Pillow>=11,<13",
  "django-stubs-ext>=6.1",
  "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
server = [
  "gunicorn>=23,<24",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "black>=25.1",
  "ruff>=0.13,<1",
  "isort>=6,<7",
  "mypy>=1.18,<2",
  "django-stubs[compatible-mypy]>=6.1",
  "djangorestframework-stubs>=3.16",
  "types-beautifulsoup4>=4.12",
]

[tool.setuptools]
packages = []

[tool.black]
target-version = ["py314"]
line-length = 100

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, blind except, pyupgrade, simplify, return, pie, naming,
# tidy imports (no relative imports), comprehensions, datetime zone awareness.
select = ["E", "W", "F", "B", "BLE", "UP", "SIM", "RET", "PIE", "N", "TID", "C4", "DTZ"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["accounts", "catalog", "config", "households", "inventory", "promotions", "recipes", "shared", "shopping"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["."]
addopts = "-q"
filterwarnings = [
  "error",
  "ignore:No directory at:UserWarning",
]
