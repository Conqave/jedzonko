[project]
name = "jedzonko-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "Django>=5.2,<6",
  "djangorestframework>=3.16,<4",
  "mysqlclient>=2.2,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "Pillow>=11,<13",
  "django-stubs-ext>=5.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "black>=25.1",
  "isort>=6,<7",
  "mypy>=1.18,<2",
  "django-stubs[compatible-mypy]>=5.2",
  "djangorestframework-stubs>=3.16",
  "types-beautifulsoup4>=4.12",
]

[tool.black]
target-version = ["py314"]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["accounts", "config", "households", "inventory", "promotions", "recipes", "shared", "shopping"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["."]
addopts = "-q"
