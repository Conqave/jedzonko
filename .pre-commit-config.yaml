default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: no-markdown
        name: no Markdown files in the repository
        language: fail
        entry: "The repository keeps no Markdown files:"
        files: \.md$

      - id: no-leftover-directories
        name: no legacy, old, backup or deprecated directories
        language: fail
        entry: "Version control is the history; remove:"
        files: (^|/)(legacy|old|backup|deprecated)/

      - id: commit-message
        name: commit message follows the classic git convention
        language: python
        entry: python infra/hooks/check_commit_message.py
        stages: [commit-msg]

      - id: backend-format
        name: backend format (isort, black)
        language: system
        entry: docker compose --env-file .env -f infra/docker-compose.yml run --rm -T backend-tools sh -c "isort --check-only . && black --check ."
        files: ^backend/
        pass_filenames: false

      - id: backend-lint
        name: backend lint (ruff)
        language: system
        entry: docker compose --env-file .env -f infra/docker-compose.yml run --rm -T backend-tools ruff check .
        files: ^backend/
        pass_filenames: false

      - id: backend-types
        name: backend types (mypy --strict)
        language: system
        entry: docker compose --env-file .env -f infra/docker-compose.yml run --rm -T backend-tools mypy .
        files: ^backend/
        pass_filenames: false

      - id: backend-migrations
        name: backend migrations match the models
        language: system
        entry: docker compose --env-file .env -f infra/docker-compose.yml run --rm -T backend-tools python manage.py makemigrations --check --dry-run
        files: ^backend/
        pass_filenames: false

      - id: backend-architecture
        name: backend architecture rules
        language: system
        entry: docker compose --env-file .env -f infra/docker-compose.yml run --rm -T backend-tools pytest -p no:cacheprovider tests/test_architecture.py
        files: ^backend/
        pass_filenames: false

      - id: backend-tests
        name: backend test suite
        language: system
        entry: docker compose --env-file .env -f infra/docker-compose.yml run --rm -T backend-tools pytest -p no:cacheprovider
        files: ^backend/
        pass_filenames: false
        stages: [pre-push]

      - id: frontend-format
        name: frontend format (prettier)
        language: system
        entry: docker compose --env-file .env -f infra/docker-compose.yml run --rm -T frontend-tools sh -c "npm run -s format:check"
        files: ^frontend/
        pass_filenames: false

      - id: frontend-lint
        name: frontend lint (eslint)
        language: system
        entry: docker compose --env-file .env -f infra/docker-compose.yml run --rm -T frontend-tools sh -c "quasar prepare --silent && npm run -s lint"
        files: ^frontend/
        pass_filenames: false

      - id: frontend-types
        name: frontend types (vue-tsc)
        language: system
        entry: docker compose --env-file .env -f infra/docker-compose.yml run --rm -T frontend-tools sh -c "quasar prepare --silent && npm run -s typecheck"
        files: ^frontend/
        pass_filenames: false

      - id: frontend-tests
        name: frontend unit tests (vitest)
        language: system
        entry: docker compose --env-file .env -f infra/docker-compose.yml run --rm -T frontend-tools sh -c "npm run -s test"
        files: ^frontend/
        pass_filenames: false

      - id: frontend-build
        name: frontend production build
        language: system
        entry: docker compose --env-file .env -f infra/docker-compose.yml run --rm -T frontend-tools sh -c "quasar prepare --silent && npm run -s build"
        files: ^frontend/
        pass_filenames: false
        stages: [pre-push]
