name: jedzonko

services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - database_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/backend.Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      DJANGO_MEDIA_ROOT: /srv/media
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_HOST: database
      MARIADB_PORT: 3306
      ALIAS_MATCHER_BASE_URL: ${ALIAS_MATCHER_BASE_URL}
      ALIAS_MATCHER_MODEL: ${ALIAS_MATCHER_MODEL}
      ALIAS_MATCHER_REASONING_EFFORT: ${ALIAS_MATCHER_REASONING_EFFORT}
      ALIAS_MATCHER_HTTP_TIMEOUT_SECONDS: ${ALIAS_MATCHER_HTTP_TIMEOUT_SECONDS}
      ALIAS_ANALYSIS_QUESTION_LIMIT: ${ALIAS_ANALYSIS_QUESTION_LIMIT}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - media_data:/srv/media

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "9000:80"

volumes:
  database_data:
  media_data:
